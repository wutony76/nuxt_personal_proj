<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="container-type:inline-size;width:100%;">
  <div style="position:relative;aspect-ratio:5/7;background:#121216;border:0.9cqw solid {{ ticket.accent }};display:flex;flex-direction:column;overflow:hidden;color:#F1EDE4;font-family:'Archivo','Noto Sans TC',sans-serif;">
    <div style="position:absolute;inset:0;pointer-events:none;background-image:radial-gradient({{ ticket.accent }} 0.45cqw, transparent 0.6cqw);background-size:3.2cqw 3.2cqw;opacity:0.16;-webkit-mask-image:linear-gradient(200deg,#000 0%,transparent 50%);mask-image:linear-gradient(200deg,#000 0%,transparent 50%);"></div>
    <div style="position:relative;display:flex;justify-content:space-between;align-items:center;padding:2.2cqw 4cqw;background:{{ ticket.accent }};color:#0A0A0C;font-family:'Space Mono',monospace;font-size:3.1cqw;font-weight:700;letter-spacing:0.06em;">
      <span>SCRATCH CITY</span>
      <span>ISSUE No.{{ ticket.issue }}</span>
    </div>
    <div style="position:relative;flex:1;display:flex;flex-direction:column;padding:4cqw 5cqw 0;min-height:0;">
      <div style="font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:3.6cqw;letter-spacing:0.2em;color:#C9C5BD;">{{ ticket.zh }} · 刮刮樂</div>
      <div style="font-family:'Anton',sans-serif;font-size:21cqw;line-height:0.88;text-transform:uppercase;margin-top:2cqw;color:{{ ticket.accent }};text-shadow:0 0 3cqw {{ ticket.glow }};">{{ ticket.w1 }}</div>
      <div style="font-family:'Anton',sans-serif;font-size:21cqw;line-height:0.88;text-transform:uppercase;color:#F1EDE4;">{{ ticket.w2 }}</div>
      <div style="margin-top:auto;font-stretch:75%;font-weight:800;font-size:3.4cqw;letter-spacing:0.14em;color:#C9C5BD;">WIN UP TO · 最高獎金</div>
      <div style="font-family:'Anton',sans-serif;font-size:12cqw;line-height:1.05;color:#FFD400;font-variant-numeric:tabular-nums;">{{ ticket.topFmt }}</div>
      <div style="margin:2.5cqw 0 4cqw;height:10cqw;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,#b9b8be 0 1.2cqw,#d6d5db 1.2cqw 2.4cqw);color:#1a1a1e;font-family:'Space Mono',monospace;font-weight:700;font-size:3.2cqw;letter-spacing:0.18em;">SCRATCH HERE · 刮這裡</div>
    </div>
    <div style="position:relative;display:flex;align-items:center;gap:3cqw;padding:2.4cqw 4cqw;background:#F1EDE4;color:#0A0A0C;">
      <div style="width:24cqw;height:7cqw;flex-shrink:0;background:repeating-linear-gradient(90deg,#0A0A0C 0 0.5cqw,transparent 0.5cqw 0.9cqw,#0A0A0C 0.9cqw 1.6cqw,transparent 1.6cqw 2.1cqw,#0A0A0C 2.1cqw 2.4cqw,transparent 2.4cqw 3.2cqw);"></div>
      <div style="flex:1;font-family:'Space Mono',monospace;font-size:2.5cqw;line-height:1.35;">SN {{ ticket.serial }}<br>ODDS {{ ticket.odds }}</div>
      <div style="font-family:'Anton',sans-serif;font-size:9cqw;line-height:1;">{{ ticket.priceFmt }}</div>
    </div>
    <div style="position:absolute;left:-2.6cqw;bottom:13cqw;width:5.2cqw;height:5.2cqw;border-radius:50%;background:#0A0A0C;"></div>
    <div style="position:absolute;right:-2.6cqw;bottom:13cqw;width:5.2cqw;height:5.2cqw;border-radius:50%;background:#0A0A0C;"></div>
    <sc-if value="{{ ticket.badge }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;top:13cqw;right:4cqw;width:20cqw;height:20cqw;border-radius:50%;background:{{ ticket.sticker }};color:#0A0A0C;display:flex;align-items:center;justify-content:center;text-align:center;padding:2cqw;box-sizing:border-box;transform:rotate(12deg);font-family:'Anton',sans-serif;font-size:4.4cqw;line-height:0.95;box-shadow:0 0.8cqw 0 #0A0A0C;border:0.5cqw dashed #0A0A0C;">{{ ticket.badge }}</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:420},&quot;ticket&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;accent&quot;:&quot;#FF2E88&quot;,&quot;sticker&quot;:&quot;#FFD400&quot;,&quot;glow&quot;:&quot;#FF2E8866&quot;,&quot;issue&quot;:&quot;07&quot;,&quot;zh&quot;:&quot;幸運七&quot;,&quot;w1&quot;:&quot;LUCKY&quot;,&quot;w2&quot;:&quot;7&quot;,&quot;topFmt&quot;:&quot;$77,777&quot;,&quot;priceFmt&quot;:&quot;$5&quot;,&quot;serial&quot;:&quot;07-23757-NYC&quot;,&quot;odds&quot;:&quot;1 : 3.9&quot;,&quot;badge&quot;:&quot;HOT!&quot;},&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
